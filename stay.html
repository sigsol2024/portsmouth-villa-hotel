<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stay | Portsmouth Villa Hotel &amp; Suites</title>
  <link rel="icon" href="assets/branding/Portsmouth Hotels logo icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portsmouth.css">
</head>
<body data-page="stay">
  <div id="site-header-root"></div>
  <main id="main" class="page">
    <header class="page-head">
      <div class="wreath wreath--black wreath--corner" aria-hidden="true"></div>
      <div class="wrap">
        <p class="label">Stay</p>
        <h1 class="h1">Four ways to stay.</h1>
        <p class="lead" id="stay-shared"></p>
        <ul class="intro-facts factbar">
          <li><span>Check-in</span><strong data-fill="checkIn"></strong></li>
          <li><span>Check-out</span><strong data-fill="checkOut"></strong></li>
          <li><span>Guests</span><strong data-fill="guests"></strong></li>
          <li><span>To confirm</span><strong data-fill="deposit"></strong></li>
        </ul>
      </div>
    </header>
    <div class="wrap">
      <div class="stay-grid" id="stay-list"></div>
    </div>
  </main>
  <div id="site-footer-root"></div>
  <script src="js/content.js"></script>
  <script src="js/images.js"></script>
  <script src="js/site-chrome.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
